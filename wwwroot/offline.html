<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Çevrimdışı — LEDKASA Sipariş</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Manrope, Segoe UI, sans-serif; background: #0B1F3A; color: #fff; text-align: center; padding: 24px; }
        .mark { width: 64px; height: 64px; border-radius: 16px; background: #F46F2C; display: grid; place-items: center; font-weight: 800; margin: 0 auto 16px; }
        p { color: #c5d2e0; max-width: 360px; }
        button { background: #F46F2C; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <div class="mark">LK</div>
        <h1>Bağlantı yok</h1>
        <p>LEDKASA Sipariş çevrimiçi çalışır. İnternet geldiğinde sipariş ve rapor işlemlerine devam edebilirsiniz.</p>
        <button onclick="location.reload()">Tekrar dene</button>
    </main>
</body>
</html>
